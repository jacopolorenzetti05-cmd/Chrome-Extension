# Job Radar – sources
# One entry per organisation. Each entry is read EVERY run from the employer's own hiring system.
#   name, sector (sports|wealth), segment, country (ISO-2 of HQ, used when a posting has no location),
#   adapter (see jobradar/adapters), params (adapter-specific), careers_url (official page), notes.
# Discovery method: every careers page below was opened in a headless browser in Nov 2026 and the
# links / network requests were inspected to find the hiring system behind it.

sources:
# ---------------------------------------------------------------- SPORTS · leagues & federations
- name: UEFA
  sector: sports
  segment: Federation
  country: CH
  adapter: jobylon
  careers_url: https://www.uefa.com/about/jobs/
  params: {list_urls: ["https://www.uefa.com/about/jobs/"], company_filter: uefa}
  notes: uefa.com lists its open roles with links to emp.jobylon.com (Jobylon). uefa.com blocks plain HTTP clients, so the list page is rendered.
- name: UC3 (UEFA Club Competitions)
  sector: sports
  segment: League
  country: CH
  adapter: jobylon
  careers_url: https://www.uc3.com/careers/
  params: {list_urls: ["https://www.uc3.com/careers/"], company_filter: uc3}
- name: FIFA
  sector: sports
  segment: Federation
  country: CH
  adapter: html
  careers_url: https://www.fifa.com/en/careers
  params: {list_urls: ["https://www.fifa.com/en/careers"], render: true, scroll: true, wait_ms: 8000,
           link_pattern: "fifa\\.com/[a-z]{2}/careers/[^?#]+[0-9a-z-]{6,}|jobs\\.fifa\\.com|fifa\\.wd\\d|fifa\\.[a-z.]*smartrecruiters|successfactors.*fifa"}
  notes: JavaScript careers page; no public ATS endpoint found. Job links are read from the rendered official page.
