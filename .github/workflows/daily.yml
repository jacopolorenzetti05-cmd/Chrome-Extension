name: Job Radar daily run

on:
  schedule:
    - cron: "17 4 * * *"     # every day 04:17 UTC (05:17 Milan); off the :00/:30 peak, when GitHub drops schedules
  workflow_dispatch: {}

permissions:
  contents: write     # commit the updated history and publish the dashboard branch

concurrency:
  group: jobradar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Job Radar (fetch every source, verify URLs, build dashboard, digest)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m jobradar run
          python -m jobradar export
          python -m pytest -q

      - name: Commit updated history
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"
          git add data/jobradar.db
          git add -f jobs.csv jobs.xlsx site/index.html site/artifact.html site/data.json out/digest.html out/digest.txt
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git pull --rebase -X ours origin main || true
          git push origin HEAD:main

      - name: Publish dashboard to the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="jobradar-bot" -c user.email="jobradar-bot@users.noreply.github.com" commit -qm "Dashboard $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
