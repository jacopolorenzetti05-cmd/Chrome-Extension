name: Job Radar daily run

on:
  schedule:
    - cron: "30 6 * * *"     # every day 06:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write     # commit the updated history
  pages: write        # publish the dashboard
  id-token: write

concurrency:
  group: jobradar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Job Radar (fetch every source, verify URLs, build dashboard, send digest)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m jobradar run --dashboard-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          python -m jobradar export
          python -m pytest -q

      - name: Commit updated history
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"
          git add data/jobradar.db
          git add -f jobs.csv jobs.xlsx
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
